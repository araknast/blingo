<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yorkle</title>
<style>
	:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
	body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
	label { display: block; margin: .5rem 0 .2rem; font-weight: 600; }
	input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem; }
	textarea { min-height: 6rem; }
	button { margin: .6rem .4rem 0 0; padding: .4rem .9rem; font: inherit; }
	pre { white-space: pre-wrap; word-break: break-all; padding: .6rem; border: 1px solid #8884; border-radius: 4px; }
	.bubble { border: 1px solid #8886; border-radius: 6px; padding: .5rem .8rem; margin: .6rem 0; }
	.bubble.hidden { opacity: .55; }
	code { font-size: .9em; }
	.badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .85em; font-weight: 600; color: #fff; }
	.badge.working { background: #9a5b00; }
	.badge.completed { background: #2e7d32; }
	.badge.failed { background: #c62828; }
	#agents li { margin: .3rem 0; }
	form, details { margin: .4rem 0; }
	summary { cursor: pointer; }
	button.file { margin: 0 .3rem 0 0; padding: 0; border: 0; background: none; color: LinkText; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<h1>yorkle</h1>

<section id="signed-out">
<form id="login">
	<label for="login-user">Username</label>
	<input id="login-user" autocomplete="username" required>
	<label for="login-pass">Password</label>
	<input id="login-pass" type="password" autocomplete="current-password" required>
	<button>Log in</button>
</form>
<details>
	<summary>Sign up with an invite</summary>
	<form id="signup">
		<label for="su-invite">Invite code</label>
		<input id="su-invite" required>
		<label for="su-user">Username</label>
		<input id="su-user" autocomplete="username" pattern="[a-z0-9_\-]{2,32}" required>
		<label for="su-email">Email</label>
		<input id="su-email" type="email" autocomplete="email" required>
		<label for="su-pass">Password (8+ characters)</label>
		<input id="su-pass" type="password" autocomplete="new-password" minlength="8" required>
		<button>Sign up</button>
	</form>
</details>
<details>
	<summary>API token</summary>
	<label for="token">API token</label>
	<input id="token" type="password" autocomplete="off">
</details>
</section>
<section id="signed-in" hidden>
	<span id="whoami"></span>
	<button id="logout">Log out</button>
	<button id="invite" hidden>New invite</button>
</section>

<label for="repo">Repository (blank = new repository)</label>
<input id="repo" placeholder="r-1234abcd" list="my-repos">
<datalist id="my-repos"></datalist>

<label for="bubble">Bubble to base the fork on (optional)</label>
<input id="bubble">

<label for="prompt">Prompt</label>
<textarea id="prompt"></textarea>

<button id="agent">Spawn agent</button>
<button id="notagent">Spawn notagent</button>
<button id="refresh">Show bubbles</button>
<button id="working">Show agents</button>

<pre id="out" aria-live="polite"></pre>
<div id="agents" aria-live="polite"></div>
<div id="bubble-view" hidden>
<div id="bubbles"></div>
<h2 id="viewer-title" hidden></h2>
<pre id="viewer" hidden></pre>
</div>

<script>
const $ = (id) => document.getElementById(id);
// The bearer (a session token, or a pasted API token) lives in #token and localStorage.
function setToken(t) {
	$("token").value = t;
	try { localStorage.setItem("blingo-token", t); } catch {}
	whoami();
}
try { $("token").value = localStorage.getItem("blingo-token") ?? ""; } catch {}
$("token").onchange = () => setToken($("token").value);

async function whoami() {
	let me = null;
	if ($("token").value) try { me = await api("GET", "/me"); } catch {}
	$("signed-out").hidden = !!me;
	$("signed-in").hidden = !me;
	if (!me) return;
	$("whoami").textContent = `Logged in as ${me.username}${me.admin ? " (admin)" : ""}`;
	$("invite").hidden = !me.admin;
	$("my-repos").replaceChildren(...me.repos.map((r) => new Option(r)));
}

$("login").onsubmit = async (e) => {
	e.preventDefault();
	try {
		const r = await api("POST", "/login", { username: $("login-user").value, password: $("login-pass").value });
		$("login-pass").value = "";
		$("out").textContent = "";
		setToken(r.token);
	} catch (err) { $("out").textContent = String(err); }
};
$("signup").onsubmit = async (e) => {
	e.preventDefault();
	try {
		await api("POST", "/signup", {
			invite: $("su-invite").value, username: $("su-user").value, email: $("su-email").value, password: $("su-pass").value,
		});
		$("su-pass").value = "";
		$("out").textContent = `Check ${$("su-email").value} for a link to create your account.`;
	} catch (err) { $("out").textContent = String(err); }
};
$("logout").onclick = async () => {
	try { await api("POST", "/logout"); } catch {}
	setToken("");
};
$("invite").onclick = async () => {
	try { $("out").textContent = `Invite code: ${(await api("POST", "/invites")).code}`; }
	catch (err) { $("out").textContent = String(err); }
};

async function api(method, path, body) {
	const res = await fetch(path, {
		method,
		headers: { authorization: `Bearer ${$("token").value}`, "content-type": "application/json" },
		body: body && JSON.stringify(body),
	});
	const data = await res.json().catch(() => ({ error: res.statusText }));
	if (!res.ok) throw new Error(data.error ?? res.status);
	return data;
}

async function spawn(kind, button) {
	button.disabled = true; // greyed out until the spawn request returns
	$("out").textContent = "…";
	try {
		const body = { repo: $("repo").value || undefined, bubble: $("bubble").value || undefined, prompt: $("prompt").value };
		const r = await api("POST", `/${kind}`, body);
		if (!$("repo").value) whoami(); // a new repository: refresh the list
		$("repo").value = r.repo;
		$("out").textContent = JSON.stringify(r, null, 2);
		if (kind === "agents") watchAgents();
	} catch (e) { $("out").textContent = String(e); }
	finally { button.disabled = false; }
}

// Only one of the agents / bubbles views is shown at a time.
function showView(name) {
	$("agents").hidden = name !== "agents";
	$("bubble-view").hidden = name !== "bubbles";
	if (name !== "agents") clearTimeout(agentTimer); // stop agents auto-refresh when leaving that view
}

async function refresh() {
	showView("bubbles");
	try {
		const { bubbles, conflicts, waiting, placing } = await api("GET", `/repos/${encodeURIComponent($("repo").value)}`);
		const el = $("bubbles");
		el.replaceChildren();
		for (const h of bubbles) {
			const d = document.createElement("div");
			d.className = "bubble" + (h.visible ? "" : " hidden");
			const title = document.createElement("strong");
			title.textContent = `${h.id}${h.visible ? "" : " (merging)"}${h.locked ? " (locked)" : ""}`;
			const lock = document.createElement("button");
			lock.textContent = h.locked ? "Unlock" : "Lock";
			lock.onclick = () => act(h.locked ? "unlock" : "lock", { bubble: h.id }, lock);
			const ul = document.createElement("ul");
			for (const m of h.members) {
				const li = document.createElement("li");
				li.append(`${m.name} — ${m.status} — `);
				if (!m.files.length) li.append("(no files)");
				for (const f of m.files) {
					const b = document.createElement("button");
					b.className = "file";
					b.textContent = f;
					b.onclick = () => showFile(m.name, f);
					li.append(b);
				}
				ul.append(li);
			}
			d.append(title, " ", lock, ul);
			el.append(d);
		}
		if (conflicts.length) {
			const h = document.createElement("h2");
			h.textContent = "Conflicting bubbles";
			const ul = document.createElement("ul");
			for (const [a, b] of conflicts) {
				const li = document.createElement("li");
				const ferge = document.createElement("button");
				ferge.textContent = "Ferge";
				ferge.onclick = () => {
					if (confirm(`Ferge ${a} and ${b}?\nTheir conflicting files are removed from both, the bubbles merge, and a new locked bubble holds those files with conflict markers.`)) {
						act("ferge", { a, b }, ferge);
					}
				};
				li.append(`${a} ⟷ ${b} `, ferge);
				ul.append(li);
			}
			el.append(h, ul);
		}
		$("out").textContent = `waiting for push: ${waiting.join(", ") || "none"}\npushed, being placed: ${placing.join(", ") || "none"}`;
	} catch (e) { $("out").textContent = String(e); }
}

// Lock / unlock / ferge, then redraw the bubbles.
async function act(op, body, button) {
	button.disabled = true;
	try {
		const r = await api("POST", `/repos/${encodeURIComponent($("repo").value)}/${op}`, body);
		await refresh();
		$("out").textContent = JSON.stringify(r, null, 2);
	} catch (e) { $("out").textContent = String(e); }
	finally { button.disabled = false; }
}

const MAX_SHOWN = 200_000;
async function showFile(fork, path) {
	$("viewer-title").hidden = $("viewer").hidden = false;
	$("viewer-title").textContent = `${fork}: ${path}`;
	$("viewer").textContent = "…";
	try {
		const res = await fetch(`/repos/${encodeURIComponent($("repo").value)}/${encodeURIComponent(fork)}?path=${encodeURIComponent(path)}`, {
			headers: { authorization: `Bearer ${$("token").value}` },
		});
		const blob = await res.blob();
		const type = res.headers.get("content-type") ?? "";
		if (!res.ok) $("viewer").textContent = await blob.text();
		else if (!type.startsWith("text/") && !type.includes("json")) $("viewer").textContent = `(binary file, ${blob.size} bytes)`;
		else {
			const text = await blob.text();
			$("viewer").textContent = text.length > MAX_SHOWN ? text.slice(0, MAX_SHOWN) + `\n… truncated (${blob.size} bytes total)` : text;
		}
		$("viewer").scrollIntoView({ behavior: "smooth", block: "nearest" });
	} catch (e) { $("viewer").textContent = String(e); }
}

$("agent").onclick = () => spawn("agents", $("agent"));
$("notagent").onclick = () => spawn("notagents", $("notagent"));
$("refresh").onclick = refresh;
// Agent run status → what the UI calls it.
const LABEL = { running: "working", placed: "completed", failed: "failed", lost: "failed" };
let agentTimer;

// Renders this repo's agents; keeps refreshing every 10s while any is working.
async function watchAgents() {
	showView("agents");
	clearTimeout(agentTimer);
	try {
		const { agents } = await api("GET", `/repos/${encodeURIComponent($("repo").value)}`);
		const ul = document.createElement("ul");
		for (const a of agents) {
			const li = document.createElement("li");
			const label = LABEL[a.status] ?? a.status;
			const badge = document.createElement("span");
			badge.className = `badge ${label}`;
			badge.textContent = a.status === "lost" ? "failed (sandbox lost)" : label;
			const mins = Math.round(((a.finished ?? Date.now()) - a.started) / 60000);
			li.append(badge, ` ${a.fork} — ${mins} min — ${a.prompt.slice(0, 120)}`);
			if (a.log) {
				const d = document.createElement("details");
				const sum = document.createElement("summary");
				sum.textContent = "log";
				const pre = document.createElement("pre");
				pre.textContent = a.log;
				d.append(sum, pre);
				li.append(d);
			}
			ul.append(li);
		}
		const working = agents.filter((a) => a.status === "running").length;
		const title = document.createElement("h2");
		title.textContent = agents.length ? `Agents: ${working} working, ${agents.length - working} finished` : "No agents on this repository";
		$("agents").replaceChildren(title, ...(agents.length ? [ul] : []));
		if (working) agentTimer = setTimeout(watchAgents, 10_000);
	} catch (e) { $("out").textContent = String(e); }
}
$("working").onclick = watchAgents;
whoami();
</script>
</body>
</html>
